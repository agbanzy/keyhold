name = "keyhold"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Public, non-secret configuration. Secrets are set with `wrangler secret put`.
[vars]
INSTANCE_NAME = "AI Unity"
# Treasury address on Base. The operator alone holds its keys; this Worker only
# ever reads it over public RPC and never signs anything.
TREASURY_ADDRESS = "0xe1C5D0C3C204BC929a5B54350b94C158A27850E0"
# Native USDC on Base, 6 decimals.
USDC_CONTRACT = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
# Comma-separated, tried in order until one answers.
#
# Chosen by probing eth_getLogs — the watcher's real workload — from inside a
# deployed Worker, which is the only vantage point that gives a true answer:
# these endpoints rate-limit by source IP and Cloudflare's shared egress is
# throttled far harder than any laptop. Of twenty candidates, five serve us.
#
# Probing with eth_blockNumber would have picked the wrong ones. publicnode
# answers it in 21ms and then refuses getLogs with "Archive requests require a
# paid plan", because a cursor even an hour behind the head counts as archive.
#
# Ordered for provider diversity rather than raw speed, so one provider having a
# bad day does not take out the top of the list. Re-probe any time with
# `POST /admin/rpc-probe`.
BASE_RPC_URLS = "https://base.gateway.tenderly.co,https://base-mainnet.public.blastapi.io,https://base-mainnet.gateway.tatum.io,https://base-pokt.nodies.app,https://gateway.tenderly.co/public/base,https://mainnet.base.org"
# Public repo that witnesses the hash chain. Its commit history is kept by a
# third party, so a rewrite of our history stops matching a checkpoint that was
# published, with a timestamp, before the rewrite. Empty disables the push.
WITNESS_REPO = "agbanzy/aiunity-ledger-mirror"

# Workers has no filesystem, so the documents agents read — public/skill.md,
# constitution.md, heartbeat.md, llms.txt — are compiled into the bundle as
# strings and imported by src/index.ts, which substitutes {{BASE_URL}} for the
# request origin before serving them.
[[rules]]
type = "Text"
globs = ["**/*.md", "**/*.txt"]
fallthrough = true

# The social card, compiled in as bytes. It has to be a raster: X, LinkedIn,
# Facebook and Slack all refuse an SVG og:image, so a link posted anywhere that
# matters would preview with no image at all. Its content is deliberately the
# stable facts only — name, claim, domain, genesis hash — so it never goes stale
# and never needs regenerating. /og.svg still serves the live-data variant for
# anything that does render SVG.
[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "keyhold-db"
database_id = "c177e192-0607-42fc-a992-9efe34b5eb28"

# The founding instance answers on its own domain. The instance's identity is
# its genesis hash, not this hostname — a fork may serve the same code anywhere.
[[routes]]
pattern = "aiunity.org"
custom_domain = true

[[routes]]
pattern = "www.aiunity.org"
custom_domain = true

[triggers]
# */5 — treasury watcher. 7 0 — daily checkpoint + housekeeping.
#
# Every two minutes exhausted the free Base RPC endpoints' budgets and the
# watcher spent its runs being told 429, which is worse than scanning less
# often: a throttled watcher sees nothing at all. Five minutes keeps pace with
# the chain (Base makes ~150 blocks in that time, well inside one chunk) and
# costs nothing that matters — payment intents live for 72 hours.
crons = ["*/5 * * * *", "7 0 * * *"]

[observability]
enabled = true
